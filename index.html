<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طباعة باركود الصيدلية</title>

  <!-- مكتبات جاهزة لقراءة Excel والباركود/QR -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f3f5f7;
      color: #17202a;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 18px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 27px;
    }
    .subtitle { color: #667085; margin-bottom: 18px; }
    .card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
    }
    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 1px dashed #98a2b3;
      border-radius: 10px;
      background: #fafafa;
    }
    input[type="text"], input[type="number"] {
      flex: 1;
      min-width: 220px;
      padding: 13px;
      border: 1px solid #cfd5dc;
      border-radius: 10px;
      font-size: 17px;
      direction: ltr;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
      background: #1769e0;
      color: white;
    }
    button.secondary { background: #667085; }
    button.success { background: #16834b; }
    button.danger { background: #c62828; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .status {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 9px;
      background: #eef4ff;
      color: #2456a6;
      line-height: 1.6;
    }
    .product {
      display: none;
      border: 2px solid #d9e2ec;
      border-radius: 14px;
      padding: 18px;
      margin-top: 15px;
    }
    .product.show { display: block; }
    .product-name {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 8px;
    }
    .price {
      font-size: 30px;
      font-weight: 800;
      margin: 8px 0 12px;
    }
    .barcode-wrap {
      text-align: center;
      overflow: hidden;
      padding: 8px;
    }
    #barcodePreview {
      max-width: 100%;
      height: 75px;
    }
    .code-text {
      direction: ltr;
      font-family: monospace;
      font-size: 15px;
      margin-top: 3px;
    }
    #reader {
      width: 100%;
      max-width: 520px;
      margin: 15px auto 0;
      display: none;
    }
    .hint {
      color: #667085;
      font-size: 14px;
      line-height: 1.7;
    }
    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .stat {
      background: #f5f7fa;
      border-radius: 9px;
      padding: 9px 13px;
    }
    .duplicate-list {
      margin-top: 10px;
      display: none;
    }
    .duplicate-item {
      display: block;
      width: 100%;
      text-align: right;
      margin: 7px 0;
      background: #f5f7fa;
      color: #17202a;
      border: 1px solid #d8dee6;
    }

    /* شكل الملصق عند الطباعة */
    #printArea { display: none; }

    @media print {
      @page {
        size: 80mm auto;
        margin: 0;
      }
      html, body {
        width: 80mm;
        margin: 0;
        padding: 0;
        background: white;
      }
      body > * { display: none !important; }
      #printArea {
        display: block !important;
        width: 72mm;
        margin: 0 auto;
        padding: 2mm 0;
        text-align: center;
        direction: rtl;
        font-family: Tahoma, Arial, sans-serif;
        page-break-after: always;
      }
      #printArea .p-name {
        font-size: 15px;
        font-weight: 700;
        line-height: 1.25;
        max-height: 12mm;
        overflow: hidden;
      }
      #printArea .p-price {
        font-size: 19px;
        font-weight: 800;
        margin: 1mm 0;
      }
      #printArea .p-barcode {
        width: 68mm;
        max-height: 20mm;
      }
      #printArea .p-code {
        direction: ltr;
        font-family: monospace;
        font-size: 10px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="card">
      <h1>🏷️ طباعة باركود الصيدلية</h1>
      <div class="subtitle">ارفع مخزون Excel ثم امسح الباركود أو QR Code لإظهار الصنف وسعره.</div>

      <input id="excelFile" type="file" accept=".xlsx,.xls,.csv">

      <div id="status" class="status">
        لم يتم تحميل ملف المخزون بعد.
      </div>

      <div id="stats" class="stats"></div>
    </div>

    <div class="card">
      <h2>🔎 البحث / قراءة الكود</h2>

      <div class="row">
        <input id="codeInput" type="text" placeholder="امسح الباركود بالماسح أو اكتب الرقم هنا">
        <button id="searchBtn">بحث</button>
        <button id="scanBtn" class="success">📷 فتح الكاميرا</button>
      </div>

      <div class="hint">
        لو عندك Barcode Scanner USB، وصّله بالكمبيوتر واضغط داخل الخانة ثم امسح الكود.
        ولو عايز تستخدم كاميرا الكمبيوتر/الموبايل اضغط «فتح الكاميرا».
      </div>

      <div id="reader"></div>

      <div id="productCard" class="product">
        <div id="productName" class="product-name"></div>
        <div id="productPrice" class="price"></div>

        <div class="barcode-wrap">
          <svg id="barcodePreview"></svg>
          <div id="codeText" class="code-text"></div>
        </div>

        <div class="row">
          <button id="printBtn" class="success">🖨️ طباعة الملصق</button>
          <button id="clearBtn" class="secondary">مسح</button>
        </div>
      </div>

      <div id="duplicates" class="duplicate-list"></div>
    </div>
  </main>

  <!-- منطقة الملصق فقط عند الطباعة -->
  <div id="printArea">
    <div id="printName" class="p-name"></div>
    <div id="printPrice" class="p-price"></div>
    <svg id="printBarcode" class="p-barcode"></svg>
    <div id="printCode" class="p-code"></div>
  </div>

<script>
  let inventory = [];
  let currentProduct = null;
  let scanner = null;

  const $ = id => document.getElementById(id);

  function setStatus(message, type = "info") {
    $("status").textContent = message;
    $("status").style.background =
      type === "error" ? "#fff0f0" :
      type === "success" ? "#edf9f1" : "#eef4ff";
    $("status").style.color =
      type === "error" ? "#a61b1b" :
      type === "success" ? "#126b3c" : "#2456a6";
  }

  function normalize(value) {
    if (value === null || value === undefined) return "";
    return String(value).trim().replace(/\\.0$/, "");
  }

  function findColumn(headers, names) {
    const lower = headers.map(h => normalize(h).toLowerCase());
    for (const name of names) {
      const i = lower.indexOf(name.toLowerCase());
      if (i !== -1) return i;
    }
    return -1;
  }

  function findHeaderRow(rows) {
    for (let i = 0; i < Math.min(rows.length, 30); i++) {
      const values = rows[i].map(normalize);
      const hasBarcode = values.some(v => v.toLowerCase() === "product barcode");
      const hasName = values.some(v => v.toLowerCase() === "product name");
      if (hasBarcode && hasName) return i;
    }
    return -1;
  }

  $("excelFile").addEventListener("change", async function(e) {
    const file = e.target.files[0];
    if (!file) return;

    try {
      setStatus("جاري قراءة ملف Excel...", "info");

      const buffer = await file.arrayBuffer();
      const workbook = XLSX.read(buffer, { type: "array", cellDates: false });

      const sheetName = workbook.SheetNames[0];
      const sheet = workbook.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });

      const headerRow = findHeaderRow(rows);

      if (headerRow === -1) {
        throw new Error("لم أجد أعمدة Product Barcode و Product Name في الملف.");
      }

      const headers = rows[headerRow].map(normalize);

      const barcodeCol = findColumn(headers, ["Product Barcode"]);
      const nameCol = findColumn(headers, ["Product Name"]);
      const priceCol = findColumn(headers, ["Sales Price"]);
      const qtyCol = findColumn(headers, ["QoH"]);
      const refCol = findColumn(headers, ["Product Ref"]);

      inventory = [];

      for (let i = headerRow + 1; i < rows.length; i++) {
        const row = rows[i];
        const barcode = normalize(row[barcodeCol]);
        const name = normalize(row[nameCol]);

        if (!barcode || !name) continue;

        inventory.push({
          barcode,
          name,
          price: priceCol >= 0 ? normalize(row[priceCol]) : "",
          qty: qtyCol >= 0 ? normalize(row[qtyCol]) : "",
          ref: refCol >= 0 ? normalize(row[refCol]) : ""
        });
      }

      // حفظ نسخة محلية في المتصفح
      try {
        localStorage.setItem("pharmacyInventory", JSON.stringify(inventory));
        localStorage.setItem("pharmacyInventoryDate", new Date().toISOString());
      } catch(e) {}

      $("stats").innerHTML = `
        <div class="stat">📦 الأصناف ذات الباركود: <b>${inventory.length.toLocaleString()}</b></div>
        <div class="stat">📄 الورقة: <b>${sheetName}</b></div>
      `;

      setStatus(`تم تحميل المخزون بنجاح: ${inventory.length.toLocaleString()} صنف.`, "success");
    } catch (err) {
      console.error(err);
      setStatus("حصل خطأ أثناء قراءة الملف: " + err.message, "error");
    }
  });

  // استرجاع آخر مخزون من المتصفح
  window.addEventListener("load", () => {
    try {
      const saved = localStorage.getItem("pharmacyInventory");
      if (saved) {
        inventory = JSON.parse(saved);
        $("stats").innerHTML = `
          <div class="stat">📦 مخزون محفوظ: <b>${inventory.length.toLocaleString()}</b> صنف</div>
        `;
        setStatus("تم استرجاع آخر ملف مخزون محفوظ في هذا المتصفح.", "success");
      }
    } catch(e) {}
  });

  function searchCode(code) {
    code = normalize(code);
    if (!code) return;

    $("duplicates").style.display = "none";
    $("duplicates").innerHTML = "";

    const matches = inventory.filter(x => x.barcode === code);

    if (matches.length === 0) {
      currentProduct = null;
      $("productCard").classList.remove("show");
      setStatus(`لم يتم العثور على باركود: ${code}`, "error");
      return;
    }

    if (matches.length > 1) {
      $("duplicates").style.display = "block";
      $("duplicates").innerHTML =
        `<b>⚠️ يوجد أكثر من صنف بنفس الباركود (${matches.length}). اختر الصنف:</b>`;

      matches.forEach((item, index) => {
        const btn = document.createElement("button");
        btn.className = "duplicate-item";
        btn.textContent = `${index + 1}) ${item.name} — ${item.price || "-"} ريال`;
        btn.onclick = () => showProduct(item);
        $("duplicates").appendChild(btn);
      });
    }

    showProduct(matches[0]);
  }

  function showProduct(item) {
    currentProduct = item;

    $("productName").textContent = item.name;
    $("productPrice").textContent = item.price ? `${item.price} ريال` : "السعر غير موجود";
    $("codeText").textContent = item.barcode;

    $("productCard").classList.add("show");

    drawBarcode("barcodePreview", item.barcode);

    setStatus(`تم العثور على: ${item.name}`, "success");
  }

  function drawBarcode(elementId, value) {
    const el = document.getElementById(elementId);
    el.innerHTML = "";

    let format = "CODE128";
    if (/^\\d{13}$/.test(value)) format = "EAN13";
    else if (/^\\d{8}$/.test(value)) format = "EAN8";
    else if (/^\\d{12}$/.test(value)) format = "UPC";

    try {
      JsBarcode(el, value, {
        format,
        displayValue: false,
        margin: 2,
        height: 55,
        width: 1.7
      });
    } catch (e) {
      // بعض الأكواد غير القياسية: نستخدم Code128
      JsBarcode(el, value, {
        format: "CODE128",
        displayValue: false,
        margin: 2,
        height: 55,
        width: 1.7
      });
    }
  }

  $("searchBtn").addEventListener("click", () => {
    searchCode($("codeInput").value);
  });

  $("codeInput").addEventListener("keydown", e => {
    if (e.key === "Enter") {
      e.preventDefault();
      searchCode($("codeInput").value);
    }
  });

  $("clearBtn").addEventListener("click", () => {
    currentProduct = null;
    $("codeInput").value = "";
    $("productCard").classList.remove("show");
    $("duplicates").style.display = "none";
    setStatus("جاهز لقراءة باركود جديد.");
    $("codeInput").focus();
  });

  $("printBtn").addEventListener("click", () => {
    if (!currentProduct) return;

    $("printName").textContent = currentProduct.name;
    $("printPrice").textContent =
      currentProduct.price ? `${currentProduct.price} ريال` : "";

    $("printCode").textContent = currentProduct.barcode;
    drawBarcode("printBarcode", currentProduct.barcode);

    // نافذة الطباعة تطبع الملصق فقط بسبب CSS الخاص بالطباعة
    setTimeout(() => window.print(), 150);
  });

  async function startScanner() {
    if (scanner) return;

    $("reader").style.display = "block";
    $("scanBtn").disabled = true;
    $("scanBtn").textContent = "📷 الكاميرا تعمل...";

    scanner = new Html5Qrcode("reader");

    try {
      await scanner.start(
        { facingMode: "environment" },
        {
          fps: 10,
          qrbox: { width: 280, height: 160 },
          aspectRatio: 1.777778
        },
        decodedText => {
          $("codeInput").value = decodedText;
          searchCode(decodedText);
          stopScanner();
        },
        () => {}
      );
    } catch (err) {
      console.error(err);
      setStatus("لم أستطع تشغيل الكاميرا. تأكد من السماح للمتصفح باستخدام الكاميرا وأن الموقع يعمل عبر HTTPS.", "error");
      stopScanner();
    }
  }

  async function stopScanner() {
    if (!scanner) return;

    try {
      await scanner.stop();
      await scanner.clear();
    } catch(e) {}

    scanner = null;
    $("reader").style.display = "none";
    $("scanBtn").disabled = false;
    $("scanBtn").textContent = "📷 فتح الكاميرا";
  }

  $("scanBtn").addEventListener("click", () => {
    if (scanner) stopScanner();
    else startScanner();
  });
</script>
</body>
</html>
